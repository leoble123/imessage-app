[package]
name = "imessage_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "imessage_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Points at the rustpush core used by OpenBubbles - same underlying iMessage
# protocol implementation, just called from Kotlin instead of Dart/Flutter.
# default-features = false skips the "macos-validation-data" feature (and the
# open-absinthe crate it pulls in), since that path is an unimplemented stub
# upstream (panic!("Not supported with binary!")). We exclusively use the
# RelayConfig path instead, which forwards validation-data requests to our
# own relay server - fully implemented, no stub involved.
# default-features = false drops "macos-validation-data" and the
# open-absinthe crate behind it, which is an unimplemented stub upstream
# (panic!("Not supported with binary!")) - the exact wall a self-built client
# hits when it tries to generate validation data locally.
#
# remote-anisette-v3 is the replacement, and the whole reason this can work:
# it takes the anisette/validation-data problem off the device entirely and
# asks a relay server for it instead. That's the path OpenBubbles itself
# uses, and it's what the relay already running on your VM answers.
rustpush = { path = "../vendor/rustpush", default-features = false, features = ["remote-anisette-v3"] }
uniffi = { version = "0.28", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1.0"
serde_json = "1.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
